---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:latest
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      memory_limiter:
        check_interval: 1s
        limit_mib: 512

    exporters:
      # Debug exporter - logs to stdout
      debug:
        verbosity: detailed

      # Prometheus exporter for metrics
      # prometheus:
      #   endpoint: 0.0.0.0:8889

      # Future: Add exporters for external services
      # - Jaeger for traces
      # - Loki for logs
      # - Prometheus remote write

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
